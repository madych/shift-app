<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>シフト表</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
body{font-family:sans-serif;text-align:center;margin:10px;}
table{border-collapse:collapse;margin:auto;width:100%;max-width:900px;}
th,td{border:1px solid #ccc;padding:6px;text-align:center;font-size:14px;}
th{background:#f5f5f5;}
.name{min-width:80px;}
button{margin:4px;padding:6px 10px;font-size:13px;}
.delete{display:none;}
@media(min-width:600px){
.delete{display:table-cell;}
}
</style>
</head>

<body>

<h3>シフト表</h3>

<div>
<button onclick="prevWeek()">◀</button>
<span id="weekLabel"></span>
<button onclick="nextWeek()">▶</button>
</div>

<div>
<button onclick="addStaff()">＋</button>
<button onclick="save()">保存</button>
<button onclick="makeImage()">画像</button>
</div>

<div id="tableArea">読み込み中...</div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbzI5DIotYt29gyMCYVhAnE9qIWDZ-qNQA_7eIlQ8ZCy-ZI3WvjKxmVTJMA1dOQ1qwe-/exec"

let staff=[]
let shifts={}
let weekOffset=0

const days=["月","火","水","木","金","土"]
const list=["","〇","9:00〜","10:30〜","11:00〜","16:00〜","16:30〜","17:00〜","18:30〜","19:00〜"]

function monday(d){
d=new Date(d)
const day=d.getDay()
const diff=d.getDate()-day+(day==0?-6:1)
return new Date(d.setDate(diff))
}

function dates(){
let m=monday(new Date())
m.setDate(m.getDate()+weekOffset*7)
let arr=[]
for(let i=0;i<6;i++){
let d=new Date(m)
d.setDate(m.getDate()+i)
arr.push(d)
}
return arr
}

function key(){
let m=monday(new Date())
m.setDate(m.getDate()+weekOffset*7)
return m.toISOString().slice(0,10)
}

function render(){

let d=dates()

document.getElementById("weekLabel").innerText=
(d[0].getMonth()+1)+"/"+d[0].getDate()

let html="<table><tr><th>名前</th>"

d.forEach((x,i)=>{
html+="<th>"+days[i]+"<br>"+(x.getMonth()+1)+"/"+x.getDate()+"</th>"
})

html+="</tr>"

staff.forEach((s,i)=>{

html+="<tr>"

html+="<td contenteditable oninput='nameEdit("+i+",this)'>"+s+"</td>"

d.forEach((x,di)=>{
let k=key()+"_"+i+"_"+di
let v=shifts[k]||""
html+="<td contenteditable onclick='tap(this)' oninput='edit("+i+","+di+",this)'>"+v+"</td>"
})

html+="</tr>"

})

html+="</table>"

document.getElementById("tableArea").innerHTML=html
}

function tap(c){
let v=c.innerText.trim()
let i=list.indexOf(v)
i=(i+1)%list.length
c.innerText=list[i]
}

function addStaff(){
staff.push("名前")
render()
}

function nameEdit(i,e){
staff[i]=e.innerText
}

function edit(i,d,e){
shifts[key()+"_"+i+"_"+d]=e.innerText
}

function prevWeek(){
weekOffset--
load()
}

function nextWeek(){
weekOffset++
load()
}

function save(){

fetch(API_URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({staff,shifts}),
mode:"no-cors"
})

alert("保存しました")

}

async function load(){
try{
let r=await fetch(API_URL)
let j=await r.json()
staff=j.staff||[]
shifts=j.shifts||{}
}catch(e){}
render()
}

function makeImage(){
html2canvas(document.getElementById("tableArea")).then(c=>{
let img=c.toDataURL()
let w=window.open("")
w.document.write("<img src='"+img+"' width='100%'>")
})
}

load()

</script>

</body>
</html>
